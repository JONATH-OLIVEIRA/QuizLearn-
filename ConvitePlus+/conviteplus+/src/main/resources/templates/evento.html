<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Evento</title>
</head>
<body>
    <h1>Criar Evento</h1>

    <!-- Enviando para a rota do controlador que vai processar o evento -->
    <form action="/evento/criar" method="post">
        <!-- Corrigido: Thymeleaf usa th:value -->
        <input type="hidden" name="anfitriaoId" th:value="${anfitriaoId}">  

        <label for="nomeEvento">Nome do Evento:</label>
        <input type="text" id="nomeEvento" name="nomeEvento" required><br><br>

        <label for="enderecoEvento">Endereço do Evento:</label>
        <input type="text" id="enderecoEvento" name="enderecoEvento" required><br><br>

        <label for="quantConvidados">Quantidade de Convidados:</label>
        <input type="number" id="quantConvidados" name="quantConvidados" required><br><br>

        <button type="submit">Criar Evento</button>
    </form>
</body>
</html>
