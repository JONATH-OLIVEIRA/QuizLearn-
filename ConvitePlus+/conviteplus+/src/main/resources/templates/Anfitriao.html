<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Anfitrião</title>
</head>
<body>
    <h2>Login</h2>
    <form id="loginForm">
        <label for="email">Email:</label>
        <input type="email" id="email" required><br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" required><br><br>

        <button type="submit">Entrar</button>
    </form>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Evita que o formulário envie um GET automaticamente
            
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            fetch("/api/anfitrioes/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, senha })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro no login");
                }
                return response.json();
            })
            .then(data => {
                console.log("Login realizado com sucesso:", data);
                alert(`Bem-vindo, ${data.anfitriao.nome}!`);
                // Aqui você pode redirecionar para outra página, se necessário.
            })
            .catch(error => {
                console.error("Erro:", error);
                alert("Falha no login. Verifique seu e-mail e senha.");
            });
        });
    </script>
</body>
</html>
